<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Blue gradient background -->
    <linearGradient id="headerBgGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e5ba8" />
      <stop offset="100%" stopColor="#0d47a1" />
    </linearGradient>
    
    <!-- Metallic gradient for text and icons -->
    <linearGradient id="headerMetallicGradient" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="50%" stopColor="#e0e0e0" />
      <stop offset="100%" stopColor="#b0b0b0" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="200" height="200" rx="40" fill="url(#headerBgGradient)" />
  
  <!-- "L" text -->
  <text x="20" y="160" fontFamily="Arial, sans-serif" fontSize="140" fontWeight="bold" fill="url(#headerMetallicGradient)">L</text>
  
  <!-- "i" text -->
  <text x="95" y="160" fontFamily="Arial, sans-serif" fontSize="140" fontWeight="bold" fill="url(#headerMetallicGradient)">i</text>
  
  <!-- Link chain icon -->
  <g transform="translate(130, 50)">
    <!-- First ring -->
    <circle cx="20" cy="35" r="20" fill="none" stroke="url(#headerMetallicGradient)" strokeWidth="8"/>
    
    <!-- Second ring overlapping -->
    <circle cx="50" cy="35" r="20" fill="none" stroke="url(#headerMetallicGradient)" strokeWidth="8"/>
    
    <!-- Connection overlay -->
    <ellipse cx="35" cy="35" rx="10" ry="20" fill="url(#headerBgGradient)"/>
  </g>
  
  <!-- "nking" text (smaller, below) -->
  <text x="20" y="195" fontFamily="Arial, sans-serif" fontSize="60" fontWeight="500" fill="url(#headerMetallicGradient)">nking</text>
</svg>