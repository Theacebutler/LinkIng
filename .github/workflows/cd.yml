name: Build and deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        run: |
          echo "LOWERCASE_GITHUB_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push all images
        uses: docker/bake-action@v6
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        with:
          files: docker-compose.yml
          push: true
          set: |
            *.platform=linux/amd64
            *.args.GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@master
        with:
          host: "${{ secrets.HOST }}"
          debug: true
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "docker-compose.yml"
          target: "~/linking/"

      - name: Deploy stack via ssh
        uses: appleboy/ssh-action@v1
        with:
          host: "${{ secrets.HOST }}"
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          debug: true
          script: |
            cd ~/linking
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            export GITHUB_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER,,}
            docker compose pull
            docker compose up -d --remove-orphans
